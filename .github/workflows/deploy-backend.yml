name: deploy-backend

# Despliegue automático del backend a Cloudflare Workers (022,
# despliegue-automático). Nace de dos incidentes reales de producción en
# despliegues manuales (Sesiones 021 y 035) — un runner de GitHub Actions
# parte de un checkout limpio en cada ejecución, eliminando la clase de bug
# que causó el segundo.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx vitest run

      - run: npm run build

      - run: npm run lint

      # Detecta problemas de configuración (binding roto, wrangler.toml
      # inválido) sin gastar un despliegue real.
      - name: Dry-run antes del despliegue real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Desplegar a Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test — /salud debe responder 200
        run: |
          sleep 5
          codigo=$(curl -s -o /dev/null -w '%{http_code}' https://undreocol-api.undreocol.workers.dev/salud)
          if [ "$codigo" != "200" ]; then
            echo "::error::/salud respondió $codigo tras el despliegue, se esperaba 200"
            exit 1
          fi
