name: deploy-frontend

# Despliegue automático del frontend a Cloudflare Workers (022,
# despliegue-automático). Nace de dos incidentes reales de producción en
# despliegues manuales:
#   Sesión 021: `npm run build` (solo next build) en vez de `npm run
#     pages:build` dejó el sitio completo en 404 por minutos —
#     .open-next/worker.js nunca se generó.
#   Sesión 035: un frontend/.env.production local, gitignored e invisible en
#     el código, sobrescribía NEXT_PUBLIC_API_URL en cada build — el
#     navegador llamaba a la API cruzando de dominio, la cookie de sesión
#     quedaba de tercero, y navegadores con bloqueo de cookies de terceros
#     (la mayoría hoy) la descartaban. Horas de diagnóstico.
# Un runner de GitHub Actions parte de un checkout limpio en cada ejecución:
# el segundo incidente no puede volver a pasar aquí. El workflow además
# repite en CI, automáticamente, las comprobaciones que encontraron ambos
# bugs a mano.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que no exista un .env.production colado
        run: |
          if [ -f .env.production ]; then
            echo "::error::frontend/.env.production existe en el checkout. NEXT_PUBLIC_API_URL no debe definirse en producción (020) — aborta el despliegue. Ver CHANGELOG Sesión 035."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      # pages:build, NUNCA build a secas (Sesión 021). pages:build ya corre
      # `next build` internamente — un paso `npm run build` aparte sería el
      # mismo build dos veces.
      - run: npm run pages:build

      - name: Confirmar que .open-next/worker.js se generó
        run: test -f .open-next/worker.js

      - name: Confirmar que el paquete compilado NO llama a la API cruzando dominio
        # Repite, en CI, el `grep` manual que encontró la causa raíz de la
        # Sesión 035 — si NEXT_PUBLIC_API_URL vuelve a colarse apuntando a
        # la URL absoluta, esto detiene el despliegue antes de producción.
        run: |
          if grep -rl "undreocol-api.undreocol.workers.dev" .open-next/assets/_next/static/chunks/*.js 2>/dev/null; then
            echo "::error::El paquete compilado llama a la API cruzando dominio — revisar NEXT_PUBLIC_API_URL y que no exista .env.production. Ver CHANGELOG Sesión 035."
            exit 1
          fi

      - name: Dry-run antes del despliegue real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Desplegar a Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test — /login debe responder 200 y sin la URL vieja
        run: |
          sleep 5
          codigo=$(curl -s -o /tmp/login.html -w '%{http_code}' https://undreocol-frontend.undreocol.workers.dev/login)
          if [ "$codigo" != "200" ]; then
            echo "::error::/login respondió $codigo tras el despliegue, se esperaba 200"
            exit 1
          fi
          if grep -q "undreocol-api.undreocol.workers.dev" /tmp/login.html; then
            echo "::error::/login en producción todavía referencia la URL absoluta de la API"
            exit 1
          fi
