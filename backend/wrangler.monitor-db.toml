name = "undreocol-monitor-db"
main = "src/cron/monitor-db.ts"
# Fecha máxima que soporta el runtime local (wrangler 4.86.0).
compatibility_date = "2026-05-03"

[triggers]
crons = ["30 5 * * *"]

# SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY se inyectan por entorno:
# local → backend/.dev.vars; producción → secrets de Mateo.

# Email Workers (010, spec §3.8): alerta real cuando el nivel es alerta/crítico.
# No es sensible (a diferencia de las claves de Supabase): var normal, no secreto.
[vars]
# TODO(Mateo): reemplazar por el buzón real de monitoreo antes de producción.
ALERTA_EMAIL_DESTINO = "alertas@undreocol.app"

[[send_email]]
name = "EMAIL"
